<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настя ❤️</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
    }
    h1 {
      font-size: 3rem;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      animation: fadeIn 2s ease-in-out;
      margin-bottom: 20px;
    }
    img {
      max-width: 200px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #fff;
      color: #ff5e78;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #ffe3e9;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Настя, я тебя люблю ❤️</h1>
  <img src="data:image/jpeg;base64,[ТВОЁ ИЗОБРАЖЕНИЕ]" alt="Настя">

  <button onclick="playMusic()">Воспроизвести музыку</button>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает воспроизведение аудио.
  </audio>

  <script>
    function playMusic() {
      const audio = document.getElementById('bgMusic');
      audio.play();
    }

    // Попытка автозапуска при загрузке
    window.addEventListener('load', () => {
      const audio = document.getElementById('bgMusic');
      audio.play().catch(() => {
        // Браузер заблокировал автозапуск — пользователь должен нажать кнопку
      });
    });
  </script>
</body>
</html>
